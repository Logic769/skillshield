name: False positive
description: A safe skill was flagged
labels: ["false-positive"]
body:
  - type: markdown
    attributes:
      value: |
        False positives are as important as missed detections: a scanner people switch off protects no one. Thank you for reporting this.
  - type: checkboxes
    id: checks
    attributes:
      label: Before you start
      options:
        - label: I agree to follow the [Code of Conduct](https://github.com/obielin/skillshield/blob/main/CODE_OF_CONDUCT.md)
          required: true
        - label: I searched existing issues and this has not been reported
          required: true
  - type: input
    id: rule
    attributes:
      label: Rule ID
      placeholder: SG-005
    validations:
      required: true
  - type: textarea
    id: text
    attributes:
      label: The text that was flagged
      description: The smallest part of the skill that still triggers the finding. Remove anything private.
      render: markdown
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why is this safe?
      description: What the skill is doing and why this wording is legitimate.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: SkillShield version
      placeholder: output of skillshield --version
    validations:
      required: true
